name: tsudoro
description: "Tsudoro のスマホアプリ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.4
  http: ^1.6.0
  material_ui: ^1.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
